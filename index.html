```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DFI TV Dashboard</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: none;

      /* Professional transition */
      opacity: 0;
      transform: scale(1.02);
      transition:
        opacity 1s ease-in-out,
        transform 1s ease-in-out;
    }

    iframe.visible {
      opacity: 1;
      transform: scale(1);
    }

    #introVideo {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;

      /* Same transition as dashboard */
      opacity: 1;
      transform: scale(1);
      transition:
        opacity 1s ease-in-out,
        transform 1s ease-in-out;
    }

    #introVideo.fade-out {
      opacity: 0;
      transform: scale(1.02);
    }
  </style>
</head>

<body>

  <!-- DFI Intro Video -->
  <video
    id="introVideo"
    autoplay
    muted
    playsinline>
    <source src="dfi_intro_v7.mp4" type="video/mp4">
  </video>

  <!-- Looker Studio Dashboard -->
  <iframe id="reportFrame"
    src="https://lookerstudio.google.com/embed/reporting/c132c5eb-65fa-496f-ad25-ca9933f51177/page/hn66E"
    allowfullscreen
    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
  </iframe>


  <script>

    const urls = [
      "https://lookerstudio.google.com/embed/reporting/c132c5eb-65fa-496f-ad25-ca9933f51177/page/hn66E",
      "https://lookerstudio.google.com/embed/reporting/ee650d72-7efa-4b7a-b3b2-939435c4a907/page/hn66E"
    ];

    let current = 0;

    const frame = document.getElementById("reportFrame");
    const video = document.getElementById("introVideo");


    // ==========================================
    // VIDEO → DASHBOARD 1
    // ==========================================

    video.addEventListener("ended", () => {

      // Fade and slightly zoom the video out
      video.classList.add("fade-out");

      // Prepare dashboard
      frame.style.display = "block";

      // Wait briefly, then fade dashboard in
      setTimeout(() => {
        frame.classList.add("visible");
      }, 100);

      // Remove video after transition
      setTimeout(() => {
        video.style.display = "none";
      }, 1000);

    });


    // ==========================================
    // DASHBOARD 1 → DASHBOARD 2
    // ==========================================

    setInterval(() => {

      // Fade dashboard out
      frame.classList.remove("visible");

      // Wait for fade-out
      setTimeout(() => {

        // Change dashboard
        current = (current + 1) % urls.length;
        frame.src = urls[current];

        // Reset dashboard position
        frame.style.transform = "scale(1.02)";

        // Fade dashboard back in
        setTimeout(() => {
          frame.classList.add("visible");
        }, 150);

      }, 1000);

    }, 60000);

  </script>

</body>
</html>
