```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DFI TV Dashboard</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    /* ==============================
       INTRO VIDEO
       ============================== */

    #introVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
      z-index: 10;

      opacity: 1;
      transform: scale(1);

      transition:
        opacity 1.2s ease-in-out,
        transform 1.2s ease-in-out;
    }

    /* ==============================
       DASHBOARD
       ============================== */

    #reportFrame {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      border: none;

      opacity: 0;
      transform: scale(1.02);

      transition:
        opacity 1.2s ease-in-out,
        transform 1.2s ease-in-out;
    }

    /* Visible dashboard */
    #reportFrame.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Hidden dashboard */
    #reportFrame.hidden {
      opacity: 0;
      transform: scale(1.02);
    }

  </style>
</head>

<body>

  <!-- DFI Intro Video -->
  <video
    id="introVideo"
    autoplay
    muted
    playsinline>

    <source src="dfi_intro_v7.mp4" type="video/mp4">

  </video>


  <!-- Looker Studio Dashboard -->
  <iframe
    id="reportFrame"
    src="https://lookerstudio.google.com/embed/reporting/c132c5eb-65fa-496f-ad25-ca9933f51177/page/hn66E"
    allowfullscreen
    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
  </iframe>


  <script>

    const urls = [
      "https://lookerstudio.google.com/embed/reporting/c132c5eb-65fa-496f-ad25-ca9933f51177/page/hn66E",
      "https://lookerstudio.google.com/embed/reporting/ee650d72-7efa-4b7a-b3b2-939435c4a907/page/hn66E"
    ];

    let current = 0;

    const frame = document.getElementById("reportFrame");
    const video = document.getElementById("introVideo");


    // ==========================================
    // INTRO VIDEO → DASHBOARD
    // ==========================================

    video.addEventListener("ended", () => {

      // Prepare dashboard
      frame.classList.add("hidden");

      // Fade out video
      video.style.opacity = "0";
      video.style.transform = "scale(1.02)";


      // Start dashboard fade/zoom
      setTimeout(() => {

        frame.style.display = "block";

        // Force browser to recognize starting state
        requestAnimationFrame(() => {

          frame.classList.add("visible");

        });

      }, 200);


      // Remove video after transition
      setTimeout(() => {

        video.style.display = "none";

      }, 1200);

    });


    // ==========================================
    // DASHBOARD SWITCH
    // ==========================================

    function switchDashboard() {

      // Fade dashboard out
      frame.classList.remove("visible");
      frame.classList.add("hidden");


      // Wait for fade-out
      setTimeout(() => {

        // Change dashboard
        current = (current + 1) % urls.length;
        frame.src = urls[current];


        // Wait briefly for new dashboard
        setTimeout(() => {

          // Fade new dashboard in
          frame.classList.remove("hidden");
          frame.classList.add("visible");

        }, 300);

      }, 1200);

    }


    // ==========================================
    // SWITCH EVERY 1 MINUTE
    // ==========================================

    setInterval(() => {

      switchDashboard();

    }, 60000);

  </script>

</body>
</html>
