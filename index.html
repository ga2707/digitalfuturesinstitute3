```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DFI TV Dashboard</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      perspective: 1500px;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: none;

      /* Page transition */
      transform-origin: left center;
      transform: rotateY(0deg);
      transition: transform 1.2s ease-in-out;

      backface-visibility: hidden;
    }

    /* Page opening */
    iframe.page-open {
      transform: rotateY(0deg);
    }

    /* Page starting position */
    iframe.page-closed {
      transform: rotateY(90deg);
    }

    #introVideo {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
    }
  </style>
</head>

<body>

  <!-- DFI Intro Video -->
  <video
    id="introVideo"
    autoplay
    muted
    playsinline>
    <source src="dfi_intro_v7.mp4" type="video/mp4">
  </video>

  <!-- Looker Studio Dashboard -->
  <iframe id="reportFrame"
    src="https://lookerstudio.google.com/embed/reporting/c132c5eb-65fa-496f-ad25-ca9933f51177/page/hn66E"
    allowfullscreen
    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
  </iframe>


  <script>

    const urls = [
      "https://lookerstudio.google.com/embed/reporting/c132c5eb-65fa-496f-ad25-ca9933f51177/page/hn66E",
      "https://lookerstudio.google.com/embed/reporting/ee650d72-7efa-4b7a-b3b2-939435c4a907/page/hn66E"
    ];

    let current = 0;

    const frame = document.getElementById("reportFrame");
    const video = document.getElementById("introVideo");


    // ==========================================
    // When intro video finishes
    // ==========================================

    video.addEventListener("ended", () => {

      video.style.display = "none";

      // Show dashboard in closed position
      frame.style.display = "block";
      frame.classList.add("page-closed");

      // Small delay so browser registers starting position
      setTimeout(() => {
        frame.classList.remove("page-closed");
        frame.classList.add("page-open");
      }, 100);

    });


    // ==========================================
    // Switch between dashboards every 1 minute
    // ==========================================

    setInterval(() => {

      // Close the current page
      frame.classList.remove("page-open");

      frame.classList.add("page-closed");


      // Wait for page-turn animation
      setTimeout(() => {

        // Change dashboard
        current = (current + 1) % urls.length;
        frame.src = urls[current];


        // Wait for dashboard to load
        setTimeout(() => {

          // Open the new page
          frame.classList.remove("page-closed");
          frame.classList.add("page-open");

        }, 300);

      }, 1200);

    }, 60000);

  </script>

</body>
</html>
