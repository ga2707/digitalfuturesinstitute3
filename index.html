```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DFI TV Dashboard</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    /* ==============================
       ALL SCREENS
       ============================== */

    .screen {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      border: none;

      /* Start off-screen to the LEFT */
      transform: translateX(-100%);
      transition: transform 1s ease-in-out;

      z-index: 1;
    }

    /* Screen currently visible */
    .screen.active {
      transform: translateX(0);
      z-index: 2;
    }

    /* Screen leaving to the RIGHT */
    .screen.exit {
      transform: translateX(100%);
      z-index: 1;
    }


    /* ==============================
       INTRO VIDEO
       ============================== */

    #introVideo {
      object-fit: contain;
      background: black;
    }

  </style>
</head>

<body>


  <!-- ==============================
       DFI INTRO VIDEO
       ============================== -->

  <video
    id="introVideo"
    class="screen active"
    autoplay
    muted
    playsinline>

    <source src="dfi_intro_v7.mp4" type="video/mp4">

  </video>


  <!-- ==============================
       DASHBOARD 1
       ============================== -->

  <iframe
    id="dashboard1"
    class="screen"
    src="https://lookerstudio.google.com/embed/reporting/c132c5eb-65fa-496f-ad25-ca9933f51177/page/hn66E"
    allowfullscreen
    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
  </iframe>


  <!-- ==============================
       DASHBOARD 2
       ============================== -->

  <iframe
    id="dashboard2"
    class="screen"
    src="https://lookerstudio.google.com/embed/reporting/ee650d72-7efa-4b7a-b3b2-939435c4a907/page/hn66E"
    allowfullscreen
    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
  </iframe>


  <script>

    /* ==============================
       GET SCREENS
       ============================== */

    const introVideo = document.getElementById("introVideo");
    const dashboard1 = document.getElementById("dashboard1");
    const dashboard2 = document.getElementById("dashboard2");

    const screens = [
      introVideo,
      dashboard1,
      dashboard2
    ];

    let current = 0;


    /* ==============================
       MOVE TO NEXT SCREEN
       ============================== */

    function showNext() {

      const currentScreen = screens[current];

      // Move current screen to the RIGHT
      currentScreen.classList.remove("active");
      currentScreen.classList.add("exit");


      // Move to next screen
      current = (current + 1) % screens.length;

      const nextScreen = screens[current];


      // Remove previous classes
      nextScreen.classList.remove("exit");


      // Force browser to recognize
      // the starting position
      void nextScreen.offsetWidth;


      // Slide next screen in from the LEFT
      nextScreen.classList.add("active");


      /* ==============================
         RESTART INTRO VIDEO
         ============================== */

      if (nextScreen === introVideo) {

        introVideo.currentTime = 0;

        introVideo.play();

      }


      /* ==============================
         PAUSE INTRO WHEN LEAVING
         ============================== */

      if (currentScreen === introVideo) {

        setTimeout(() => {

          introVideo.pause();

        }, 1000);

      }

    }


    /* ==============================
       INTRO → DASHBOARD 1
       ============================== */

    introVideo.addEventListener("ended", () => {

      showNext();

    });


    /* ==============================
       DASHBOARD 1 / 2 TIMING
       ============================== */

    setInterval(() => {

      // Dashboard 1 or Dashboard 2
      if (current === 1 || current === 2) {

        showNext();

      }

    }, 60000);

  </script>

</body>
</html>
